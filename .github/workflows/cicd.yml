name: Deploy Intellectia Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t intellectiabackend/intellectia  ./server
        with:
          secrets: |
            "ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY }}"
            "BASE_API=${{ secrets.BASE_API }}"
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            "REFRESH_TOKEN_KEY=${{ secrets.REFRESH_TOKEN_KEY }}"
            "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}"
      - name: Publish Image to docker hub
        run: docker push intellectiabackend/intellectia:latest

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Pull Server image from docker hub
        run: docker pull intellectiabackend/intellectia:latest
      - name: Run tests on the built server Docker image
        run: docker run --rm intellectiabackend/intellectia npm run test

  deploy:
    needs: [build, test]
    runs-on: self-hosted
    steps:
      - name: Pull docker image from hub
        run: docker pull intellectiabackend/intellectia:latest
      - name: Delete old container
        run: docker rm -f intellectia-backend-container
      - name: Run Docker Container
        run: docker run -d -p 3000:3000 --name intellectia-backend-container intellectiabackend/intellectia