name: Deploy Intellectia Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t intellectiabackend/intellectia  .
      - name: Publish Image to docker hub
        run: docker push intellectiabackend/intellectia:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull docker image from hub
        run: docker pull intellectiabackend/intellectia:latest
      - name: Delete old container
        run: docker rm -f intellectia-backend-container
      - name: Run Docker Container
        run: docker run -d -p 3000:3000 --name intellectia-backend-container intellectiabackend/intellectia